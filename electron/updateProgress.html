<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Shelf Talker Wizard Update</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 22px 24px;
    background: #fff;
    color: #1b1b1b;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 4px;
  }
  .version {
    font-size: 12px;
    color: #666;
    margin: 0 0 16px;
  }
  .bar-track {
    background: #e6e6e6;
    border-radius: 7px;
    height: 14px;
    overflow: hidden;
  }
  .bar-fill {
    background: #bd8436;
    height: 100%;
    width: 0%;
    transition: width 0.2s ease;
  }
  .row {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 13px;
    color: #444;
  }
  .percent {
    font-size: 26px;
    font-weight: 700;
    margin-top: 14px;
  }
</style>
</head>
<body>
  <h1>Downloading update&hellip;</h1>
  <p class="version" id="version"></p>
  <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
  <div class="row">
    <span id="transferred">0 MB / 0 MB</span>
    <span id="speed">0 MB/s</span>
  </div>
  <div class="percent" id="percent">0%</div>
  <script>
    window.updateAPI.onProgress((data) => {
      document.getElementById('bar').style.width = data.percent + '%';
      document.getElementById('percent').textContent = Math.round(data.percent) + '%';
      document.getElementById('transferred').textContent = data.transferredMB + ' MB / ' + data.totalMB + ' MB';
      document.getElementById('speed').textContent = data.speedMB + ' MB/s';
      if (data.version) {
        document.getElementById('version').textContent = 'Version ' + data.version;
      }
    });
  </script>
</body>
</html>
