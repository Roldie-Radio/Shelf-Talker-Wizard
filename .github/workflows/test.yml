name: Tests

# The print geometry is split across public/js/layout.js and the @media print
# rules in public/css/styles.css, and nothing at runtime notices if the two
# drift apart - the damage only shows up on paper. These run on every push so
# that drift is caught before it reaches a store PC.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No install step: the tests only use node:test and node:assert, and
      # public/js/layout.js has no dependencies of its own.
      - name: Run tests
        run: npm test
