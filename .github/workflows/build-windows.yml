name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish this build as a permanent GitHub Release"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShelfTalkerWizard-Windows-Installer
          path: dist/*.exe
          retention-days: 30

      # Figure out the release tag to use: the pushed tag itself when this run
      # was triggered by `git push --follow-tags` (from `npm run release:*`),
      # or "v<version from package.json>" when triggered manually from the
      # Actions tab (lets a release be cut without needing tag-push access).
      - name: Determine release tag
        id: release_tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            version=$(node -p "require('./package.json').version")
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

      # Publishes the installer as a permanent Release asset (workflow-run
      # artifacts above expire after 30 days). Creates the git tag too, if it
      # doesn't already exist, pointing at the commit that was built.
      - name: Publish release
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Shelf Talker Wizard ${{ steps.release_tag.outputs.tag }}
          files: dist/*.exe
          generate_release_notes: true
