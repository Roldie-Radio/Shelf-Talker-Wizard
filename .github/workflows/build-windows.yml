name: Build Windows Installer

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShelfTalkerWizard-Windows-Installer
          path: dist/*.exe
          retention-days: 30

      # Only when the run was triggered by pushing a version tag (e.g. v1.1.0),
      # also publish the installer as a permanent GitHub Release asset, since
      # workflow-run artifacts expire after 30 days.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Shelf Talker Wizard ${{ github.ref_name }}
          files: dist/*.exe
          generate_release_notes: true
